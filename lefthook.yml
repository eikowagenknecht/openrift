# Refer for explanation to following link:
# https://github.com/evilmartians/lefthook/blob/master/docs/usage.md

commit-msg:
  commands:
    lint-commit-msg:
      run: bunx commitlint --edit

pre-commit:
  parallel: false
  commands:
    oxlint-check:
      glob: "*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx}"
      run: bunx oxlint --deny-warnings '{staged_files}'
    oxlint-type-aware:
      # Separate config because --type-aware switches on every type-aware rule
      # in the enabled categories; .oxlintrc.type-aware.json turns the
      # categories off so only the rules listed there run.
      glob: "*.{ts,tsx}"
      run: bunx oxlint --type-aware -c .oxlintrc.type-aware.json '{staged_files}'
    eslint-check:
      glob: "*.{js,ts,jsx,tsx}"
      root: "apps/web/"
      run: bunx eslint --no-warn-ignored '{staged_files}'
    syncpack-lint:
      # `**/package.json` alone never matches the root file, so a range slipped
      # into the root devDependencies used to go unchecked.
      glob: ["package.json", "**/package.json"]
      run: bunx syncpack lint
    override-pins:
      # syncpack cannot see this class of drift: it groups by package name, so
      # an npm: alias and its target look like one instance each.
      # Both globs are needed — `**/package.json` does not match the root file,
      # which is where the overrides themselves live.
      glob: ["package.json", "**/package.json"]
      run: bun scripts/check-override-pins.ts
    oxfmt-fix:
      glob: "*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx,json,jsonc,md}"
      run: bunx oxfmt '{staged_files}' && git update-index --again
    docker-image-pinned:
      # Fail if a Dockerfile or docker-compose file pins to `:latest`, `:main`
      # (or any other floating tag we want to add). Pinned semver / digests
      # only — Dependabot will then surface updates as PRs.
      glob: "{Dockerfile*,**/docker-compose*.yml}"
      run: |
        bad=$(grep -HnE "(image:|^FROM)\s+\S+:(latest|main)\b" {staged_files} 2>/dev/null || true)
        if [ -n "$bad" ]; then
          echo "Floating Docker tag found — pin to an explicit version:"
          echo "$bad"
          exit 1
        fi

pre-push:
  commands:
    typescript-check:
      # Runs everywhere, including constrained remote/CI runners.
      # Goes through turbo so all packages (shared, api, web) are covered and
      # a /done that already typechecked is a cache hit here.
      glob: "*.{ts,tsx}"
      run: bun run typecheck
    knip-check:
      glob: "*.{js,ts,cjs,mjs,jsx,tsx}"
      run: bun run knip
    lockfile-check:
      glob: "**/package.json"
      run: bun install --frozen-lockfile
    test:
      run: bun run test
    test-integration:
      # Needs the local docker DB. Runs once per push; not part of /done, and
      # agents never run it manually as a verification step.
      run: bun run test:integration
