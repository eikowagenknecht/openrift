# Refer for explanation to following link:
# https://github.com/evilmartians/lefthook/blob/master/docs/usage.md

commit-msg:
  commands:
    lint-commit-msg:
      run: bunx commitlint --edit

pre-commit:
  parallel: false
  commands:
    oxlint-check:
      glob: "*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx}"
      run: bunx oxlint --deny-warnings '{staged_files}'
    eslint-check:
      glob: "*.{js,ts,jsx,tsx}"
      root: "apps/web/"
      run: bunx eslint --no-warn-ignored '{staged_files}'
    syncpack-lint:
      glob: "**/package.json"
      run: bunx syncpack lint
    oxfmt-fix:
      glob: "*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx,json,jsonc,md}"
      run: bunx oxfmt '{staged_files}' && git update-index --again
    docker-image-pinned:
      # Fail if a Dockerfile or docker-compose file pins to `:latest`, `:main`
      # (or any other floating tag we want to add). Pinned semver / digests
      # only — Dependabot will then surface updates as PRs.
      glob: "{Dockerfile*,**/docker-compose*.yml}"
      run: |
        bad=$(grep -HnE "(image:|^FROM)\s+\S+:(latest|main)\b" {staged_files} 2>/dev/null || true)
        if [ -n "$bad" ]; then
          echo "Floating Docker tag found — pin to an explicit version:"
          echo "$bad"
          exit 1
        fi

pre-push:
  commands:
    typescript-check:
      # Skipped on the constrained remote runner, where `tsgo` gets
      # OOM-killed in the constrained container. CI runs the full typecheck
      # on every PR, so this stays covered there.
      skip:
        - run: test -n "$REMOTE_RUNNER"
      glob: "*.{ts,tsx}"
      run: bun run --cwd packages/shared typecheck && bun run --cwd apps/web typecheck
    knip-check:
      # Skipped on the web/remote runner for the same memory reasons; CI covers it.
      skip:
        - run: test -n "$REMOTE_RUNNER"
      glob: "*.{js,ts,cjs,mjs,jsx,tsx}"
      run: bun run knip
    lockfile-check:
      glob: "**/package.json"
      run: bun install --frozen-lockfile
    test:
      run: bun run test
    # test-integration:
    # run: bun run test:integration
