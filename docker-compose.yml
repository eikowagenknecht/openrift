# Dev:  docker compose up db       (just Postgres; run API + Vite natively with bun dev)
# Prod: docker compose up -d       (Postgres + app + web)
services:
  # PostgreSQL database.
  db:
    image: postgres:18.4-alpine
    user: "${UID:-1000}:${GID:-1000}"
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
      -c pg_stat_statements.max=5000
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "10"
    restart: unless-stopped

  # Hono API server (runs migrations on startup, schedules cron jobs).
  api:
    image: ghcr.io/openriftapp/openrift-api:${IMAGE_TAG:-latest}
    user: "${UID:-1000}:${GID:-1000}"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./media:/app/media
    ports:
      - "127.0.0.1:${API_PORT:-3001}:3000"
    # /api/health also pings the DB, so "healthy" means actually serving.
    # start_period covers the startup migrations after a deploy.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "10"
    restart: unless-stopped

  # TanStack Start SSR server (internal only — not exposed to host).
  web:
    image: ghcr.io/openriftapp/openrift-web:${IMAGE_TAG:-latest}
    # Healthy, not just started: the SSR server serving requests into a
    # still-booting API produced connection-refused bursts on every deploy
    # and host reboot (OPENRIFT-SSR-1T/1Y/1Z).
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    environment:
      PORT: "3001"
      API_INTERNAL_URL: "http://api:3000"
      # Resolved per-container at startup from .env so the same image can ship
      # to prod and preview. Each deploy sets APP_ENV (production|preview)
      # and SITE_URL in its own .env.
      APP_ENV: "${APP_ENV:-production}"
      SITE_URL: "${SITE_URL}"
      # Sentry DSN shared by the SSR Node process and the browser SDK (the
      # browser receives it inlined into the SSR shell). The api service
      # also reads this via env_file to derive its tunnel forwarding target.
      SENTRY_DSN_SSR: "${SENTRY_DSN_SSR-}"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "10"
    restart: unless-stopped
    stop_grace_period: 15s

  # Discord bot (card lookups over the public API). Opt-in per instance: set
  # COMPOSE_PROFILES=bot in the instance's .env to run it; without the profile
  # the service is skipped entirely (preview stays bot-less by default).
  bot:
    image: ghcr.io/openriftapp/openrift-bot:${IMAGE_TAG:-latest}
    profiles:
      - bot
    depends_on:
      api:
        condition: service_healthy
    environment:
      DISCORD_BOT_TOKEN: "${DISCORD_BOT_TOKEN-}"
      # Shared with the API (which reads it from .env via env_file); unset
      # disables the group features (/link, tradelist replies).
      DISCORD_BOT_API_SECRET: "${DISCORD_BOT_API_SECRET-}"
      # Unset means log-only: trade-channel scanning logs what it would post
      # and posts nothing. Set to `reply` to let it answer for real.
      DISCORD_TRADE_SCAN_MODE: "${DISCORD_TRADE_SCAN_MODE-}"
      API_INTERNAL_URL: "http://api:3000"
      SITE_URL: "${SITE_URL}"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "10"
    restart: unless-stopped

  # Nginx reverse proxy + static asset serving (exposed to host).
  proxy:
    image: ghcr.io/openriftapp/openrift-proxy:${IMAGE_TAG:-latest}
    depends_on:
      - web
      - api
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    volumes:
      - ./media:/srv/static/media:ro
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "10"
    restart: unless-stopped
