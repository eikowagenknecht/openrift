# Standalone monitoring stack for OpenRift.
# Start: docker compose up -d
# Stop:  docker compose down
#
# Requires: .env file (copy .env.example and fill in values)
# Connects to the main app's Docker network to scrape metrics.
services:
  # Host metrics: CPU, RAM, disk, network.
  # Also serves Prometheus textfiles written by `disk-usage-exporter` via the
  # textfile collector — its /metrics endpoint merges those gauges into its
  # own output, so we don't need a separate scrape target.
  node-exporter:
    image: prom/node-exporter:v1.12.1
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - textfile_collector:/textfile:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|run)($$|/)"
      - "--collector.textfile.directory=/textfile"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    restart: unless-stopped

  # Per-container metrics: CPU, memory, network, restarts.
  # Defaults are chatty: housekeeping every 1s and every collector enabled,
  # while Prometheus only scrapes every 15s. The flags below match the
  # housekeeping interval to the scrape interval and disable collectors
  # whose output we don't surface anywhere (NUMA, hugetlb, resctrl, etc.).
  # Kept enabled: cpu, memory, network, oom_event, diskIO, tcp/udp,
  # process, referenced_memory.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    privileged: true
    command:
      - "--housekeeping_interval=15s"
      - "--max_housekeeping_interval=20s"
      - "--event_storage_event_limit=default=0"
      - "--event_storage_age_limit=default=0"
      - "--disable_metrics=disk,advtcp,sched,hugetlb,cpu_topology,resctrl,percpu"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg:/dev/kmsg
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    restart: unless-stopped

  # Telemetry stack disk usage. Bind-mounted data dirs don't show up as
  # separate filesystems in node-exporter, so we run a tiny sidecar that
  # writes per-component sizes to a Prometheus textfile every minute.
  # node-exporter picks it up via its textfile collector — no HTTP server
  # or scrape target needed here.
  # `$$` escapes Compose's own variable interpolation so the inner shell
  # sees a literal `$`.
  disk-usage-exporter:
    image: alpine:3.24
    command:
      - sh
      - -c
      - |
        while true; do
          {
            echo "# HELP telemetry_disk_usage_bytes Bytes on disk per telemetry component"
            echo "# TYPE telemetry_disk_usage_bytes gauge"
            for d in prometheus tempo loki alloy grafana; do
              size=$$(du -sb /data/$$d 2>/dev/null | awk '{print $$1}')
              echo "telemetry_disk_usage_bytes{component=\"$$d\"} $${size:-0}"
            done
          } > /textfile/disk_usage.prom.tmp
          mv /textfile/disk_usage.prom.tmp /textfile/disk_usage.prom
          sleep 60
        done
    volumes:
      - ./data:/data:ro
      - textfile_collector:/textfile
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    restart: unless-stopped

  # PostgreSQL metrics: connections, query stats, replication.
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    # The stat_replication collector's query selects pg_stat_replication.slot_name,
    # a column that does not exist in PostgreSQL 18, so every scrape fails with
    # `column "slot_name" does not exist` and logs an ERROR + STATEMENT pair to the
    # database log (~5.7k lines/day at a 15s scrape interval). It yields nothing
    # here anyway: this is a single node with no standbys, so pg_stat_replication
    # is always empty. The separate `replication` collector still provides
    # pg_replication_lag_seconds / pg_replication_is_replica.
    command:
      - --no-collector.stat_replication
    environment:
      DATA_SOURCE_NAME: ${POSTGRES_CONNECTION}
      PG_EXPORTER_EXTEND_QUERY_PATH: /etc/postgres-exporter/queries.yaml
    volumes:
      - ./queries.yaml:/etc/postgres-exporter/queries.yaml:ro
    networks:
      - default
      - openrift
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    restart: unless-stopped

  # Scrapes all exporters, stores metrics for 90 days.
  prometheus:
    image: prom/prometheus:v3.14.0
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - default
      - openrift
    # `host.docker.internal` lets Prometheus reach `bun dev:api` running on
    # the host during local development. On Linux it doesn't auto-resolve
    # without this explicit host-gateway mapping.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./data/prometheus:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}"
      - "--storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-5GB}"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--web.enable-remote-write-receiver"
      - "--enable-feature=exemplar-storage"
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    restart: unless-stopped

  # Trace store. Receives OTLP spans from Alloy (the entrypoint for all app
  # telemetry) on the internal Docker network. Queried by Grafana via :3200.
  # No host port for OTLP — apps send to Alloy, not directly here.
  tempo:
    image: grafana/tempo:3.0.3
    user: "${UID:-1000}:${GID:-1000}"
    command: ["-config.file=/etc/tempo/tempo.yml"]
    ports:
      - "127.0.0.1:3200:3200"
    networks:
      - default
      - openrift
    volumes:
      - ./tempo.yml:/etc/tempo/tempo.yml:ro
      - ./data/tempo:/var/tempo
    deploy:
      resources:
        limits:
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    restart: unless-stopped

  # Log store. Receives logs from Alloy, retains 30 days (see loki.yml).
  # Queried by Grafana via :3100 on the internal network; host 3101 is for
  # ad-hoc curl (Grafana already binds 3100 on the host).
  loki:
    image: grafana/loki:3.7.6
    user: "${UID:-1000}:${GID:-1000}"
    command: ["-config.file=/etc/loki/loki.yml"]
    ports:
      - "127.0.0.1:3101:3100"
    networks:
      - default
      - openrift
    volumes:
      - ./loki.yml:/etc/loki/loki.yml:ro
      - ./data/loki:/var/loki
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    restart: unless-stopped

  # Unified telemetry collector. Receives OTLP traces from apps on :4318
  # (HTTP) / :4317 (gRPC) and forwards to Tempo. Tails Docker container
  # stdout via the Docker socket, parses pino JSON, and ships to Loki with
  # trace_id as structured metadata for Tempo ↔ Loki pivots. UI on :12345.
  alloy:
    image: grafana/alloy:v1.18.1
    command:
      - "run"
      - "--server.http.listen-addr=0.0.0.0:12345"
      - "--storage.path=/var/lib/alloy/data"
      - "/etc/alloy/config.alloy"
    ports:
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:12345:12345"
    networks:
      - default
      - openrift
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ./data/alloy:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - tempo
      - loki
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    restart: unless-stopped

  # Dashboards + email alerting. Accessible via host nginx.
  grafana:
    image: grafana/grafana-oss:13.0.2
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3100}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: "${SMTP_HOST}:${SMTP_PORT}"
      GF_SMTP_USER: ${SMTP_USER}
      GF_SMTP_PASSWORD: ${SMTP_PASSWORD}
      GF_SMTP_FROM_ADDRESS: ${SMTP_FROM}
      GF_SMTP_FROM_NAME: "OpenRift Monitoring"
      GF_SMTP_STARTTLS_POLICY: "MandatoryStartTLS"
      GF_SERVER_ROOT_URL: "https://${GRAFANA_DOMAIN:-monitoring.openrift.app}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_UNIFIED_ALERTING_ENABLED: "true"
      GF_ALERTING_ENABLED: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: "/etc/grafana/provisioning/dashboards/home.json"
    volumes:
      - ./data/grafana:/var/lib/grafana
      - ./provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - tempo
      - loki
    deploy:
      resources:
        limits:
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    restart: unless-stopped

networks:
  openrift:
    external: true
    name: openrift_default

volumes:
  # Shared between disk-usage-exporter (writes .prom files) and node-exporter
  # (reads them via --collector.textfile.directory). Named volume so Docker
  # owns the lifecycle and permissions, avoiding root-owned ./data subdirs.
  textfile_collector:
