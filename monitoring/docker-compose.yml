# Standalone monitoring stack for OpenRift.
# Start: docker compose up -d
# Stop:  docker compose down
#
# Requires: .env file (copy .env.example and fill in values)
# Connects to the main app's Docker network to scrape metrics.
services:
  # Host metrics: CPU, RAM, disk, network.
  node-exporter:
    image: prom/node-exporter:latest
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    restart: unless-stopped

  # Per-container metrics: CPU, memory, network, restarts.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg:/dev/kmsg
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    restart: unless-stopped

  # PostgreSQL metrics: connections, query stats, replication.
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    environment:
      DATA_SOURCE_NAME: ${POSTGRES_CONNECTION}
      PG_EXPORTER_EXTEND_QUERY_PATH: /etc/postgres-exporter/queries.yaml
    volumes:
      - ./queries.yaml:/etc/postgres-exporter/queries.yaml:ro
    networks:
      - default
      - openrift
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    restart: unless-stopped

  # Scrapes all exporters, stores metrics for 90 days.
  prometheus:
    image: prom/prometheus:latest
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - default
      - openrift
    # `host.docker.internal` lets Prometheus reach `bun dev:api` running on
    # the host during local development. On Linux it doesn't auto-resolve
    # without this explicit host-gateway mapping.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./data/prometheus:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-90d}"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--web.enable-remote-write-receiver"
      - "--enable-feature=exemplar-storage"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    restart: unless-stopped

  # Trace store. Receives OTLP spans from Alloy (the entrypoint for all app
  # telemetry) on the internal Docker network. Queried by Grafana via :3200.
  # No host port for OTLP — apps send to Alloy, not directly here.
  tempo:
    image: grafana/tempo:latest
    user: "${UID:-1000}:${GID:-1000}"
    command: ["-config.file=/etc/tempo/tempo.yml"]
    ports:
      - "127.0.0.1:3200:3200"
    networks:
      - default
      - openrift
    volumes:
      - ./tempo.yml:/etc/tempo/tempo.yml:ro
      - ./data/tempo:/var/tempo
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    restart: unless-stopped

  # Log store. Receives logs from Alloy, retains 30 days (see loki.yml).
  # Queried by Grafana via :3100 on the internal network; host 3101 is for
  # ad-hoc curl (Grafana already binds 3100 on the host).
  loki:
    image: grafana/loki:latest
    user: "${UID:-1000}:${GID:-1000}"
    command: ["-config.file=/etc/loki/loki.yml"]
    ports:
      - "127.0.0.1:3101:3100"
    networks:
      - default
      - openrift
    volumes:
      - ./loki.yml:/etc/loki/loki.yml:ro
      - ./data/loki:/var/loki
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    restart: unless-stopped

  # Unified telemetry collector. Receives OTLP traces from apps on :4318
  # (HTTP) / :4317 (gRPC) and forwards to Tempo. Tails Docker container
  # stdout via the Docker socket, parses pino JSON, and ships to Loki with
  # trace_id as structured metadata for Tempo ↔ Loki pivots. UI on :12345.
  alloy:
    image: grafana/alloy:latest
    command:
      - "run"
      - "--server.http.listen-addr=0.0.0.0:12345"
      - "--storage.path=/var/lib/alloy/data"
      - "/etc/alloy/config.alloy"
    ports:
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:12345:12345"
    networks:
      - default
      - openrift
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ./data/alloy:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - tempo
      - loki
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    restart: unless-stopped

  # Dashboards + email alerting. Accessible via host nginx.
  grafana:
    image: grafana/grafana-oss:latest
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3100}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: "${SMTP_HOST}:${SMTP_PORT}"
      GF_SMTP_USER: ${SMTP_USER}
      GF_SMTP_PASSWORD: ${SMTP_PASSWORD}
      GF_SMTP_FROM_ADDRESS: ${SMTP_FROM}
      GF_SMTP_FROM_NAME: "OpenRift Monitoring"
      GF_SMTP_STARTTLS_POLICY: "MandatoryStartTLS"
      GF_SERVER_ROOT_URL: "https://${GRAFANA_DOMAIN:-monitoring.openrift.app}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_UNIFIED_ALERTING_ENABLED: "true"
      GF_ALERTING_ENABLED: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: "/etc/grafana/provisioning/dashboards/home.json"
    volumes:
      - ./data/grafana:/var/lib/grafana
      - ./provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - tempo
      - loki
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    restart: unless-stopped

networks:
  openrift:
    external: true
    name: openrift_default
