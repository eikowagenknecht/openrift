server:
  http_listen_port: 3200
  log_level: warn

distributor:
  # The API caps db.query.text at 2048 chars; the default 2048-byte limit
  # here truncates it again on multibyte text and logs a warning per span.
  max_attribute_bytes: 4096
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
        grpc:
          endpoint: 0.0.0.0:4317

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal

metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
  processor:
    span_metrics:
      # Internal spans (repo.* wrappers) are useful in traces, not as
      # per-name histograms; the dashboards read SERVER and CLIENT only.
      filter_policies:
        - include:
            match_type: regex
            attributes:
              - key: kind
                value: SPAN_KIND_(SERVER|CLIENT)
      dimensions:
        - http.route
        - http.method
        - db.system.name
      histogram_buckets: [0.005, 0.01, 0.025, 0.05, 0.1, 0.25, 0.5, 1, 2.5, 5, 10]
    service_graphs: {}

overrides:
  defaults:
    metrics_generator:
      processors: [span-metrics, service-graphs]
