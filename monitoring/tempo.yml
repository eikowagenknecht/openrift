server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
        grpc:
          endpoint: 0.0.0.0:4317

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal

metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
  processor:
    span_metrics:
      dimensions:
        - http.route
        - http.method
        - db.system.name
      histogram_buckets:
        [0.005, 0.01, 0.025, 0.05, 0.1, 0.25, 0.5, 1, 2.5, 5, 10]
    service_graphs: {}
    local_blocks:
      flush_check_period: 10s
      trace_idle_period: 10s
      complete_block_timeout: 1h
      max_live_traces: 5000

# Required for TraceQL metrics (rate, quantile_over_time, ...) backed by
# local-blocks.
query_frontend:
  metrics:
    max_duration: 24h
    concurrent_jobs: 1000

overrides:
  defaults:
    metrics_generator:
      processors: [span-metrics, service-graphs, local-blocks]
