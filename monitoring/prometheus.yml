global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Host metrics (CPU, RAM, disk, network)
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  # Per-container metrics
  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]

  # PostgreSQL metrics, 60s because table and activity stats move slowly.
  # RE2 has no negative lookahead, so kept names are marked before the drop.
  - job_name: "postgres-exporter"
    scrape_interval: 60s
    static_configs:
      - targets: ["postgres-exporter:9187"]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "pg_settings_max_connections"
        target_label: __tmp_keep
        replacement: "1"
      - source_labels: [__name__, __tmp_keep]
        regex: "pg_settings_.*;"
        action: drop
      - source_labels: [__name__]
        regex: "pg_stat_database_conflicts.*|pg_stat_statements_(seconds_mean|rows_total)"
        action: drop
      - source_labels: [__name__]
        regex: "pg_stat_user_tables_(seq_scan|seq_tup_read|idx_scan|n_tup_(ins|upd|del|hot_upd)|n_live_tup|n_dead_tup|table_size_bytes|index_size_bytes)"
        target_label: __tmp_keep
        replacement: "1"
      - source_labels: [__name__, __tmp_keep]
        regex: "pg_stat_user_tables_.*;"
        action: drop

  # Hono API: per-route HTTP metrics + Node.js runtime metrics.
  # The API is reachable at the docker-network hostname when it runs in a
  # container (prod, preview), and at host.docker.internal when it runs via
  # `bun dev:api` on the host (local dev). Only one of the two exists in any
  # given environment, so the other is always `down`.
  #
  # They are kept in separate jobs rather than as two targets of one job so
  # that the permanently-down one is not indistinguishable from a real
  # outage: alert and dashboard on `up{job="openrift-api"}`, which is exactly
  # the containerised API, and leave `openrift-api-dev` unalerted.
  - job_name: "openrift-api"
    static_configs:
      - targets: ["api:3000"]

  # Local-dev only (`bun dev:api` on the host). Expected to be down in prod
  # and preview — never alert on this job. See the note above.
  - job_name: "openrift-api-dev"
    static_configs:
      - targets: ["host.docker.internal:3000"]

  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Alloy self-monitoring (pipeline health, OTLP receive rate, Loki write rate)
  - job_name: "alloy"
    static_configs:
      - targets: ["alloy:12345"]

  # Loki self-monitoring, ingestion and error counters only.
  - job_name: "loki"
    static_configs:
      - targets: ["loki:3100"]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "up|scrape_.*|loki_build_info|loki_panic_total|loki_distributor_(lines|bytes)_received_total|loki_discarded_samples_total|loki_ingester_wal_discarded_samples_total|loki_ingester_memory_chunks|loki_request_duration_seconds_(count|sum)|loki_compactor_.*"
        action: keep

  # Per-component telemetry disk usage arrives via node-exporter's textfile
  # collector: the disk-usage-exporter sidecar writes disk_usage.prom into a
  # shared volume that node-exporter reads. No separate scrape job needed —
  # the metric appears under job="node-exporter" alongside CPU / RAM / disk.
