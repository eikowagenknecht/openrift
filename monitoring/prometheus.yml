global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Host metrics (CPU, RAM, disk, network)
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  # Per-container metrics
  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]

  # PostgreSQL metrics
  - job_name: "postgres-exporter"
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # Hono API: per-route HTTP metrics + Node.js runtime metrics.
  # Scrape both the prod docker-network hostname and host.docker.internal so
  # the same config works whether the API runs in docker (prod, preview) or
  # via `bun dev:api` on the host (local dev). The unused target shows as
  # `down` in /targets, which is expected and harmless.
  - job_name: "openrift-api"
    static_configs:
      - targets: ["api:3000", "host.docker.internal:3000"]

  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Alloy self-monitoring (pipeline health, OTLP receive rate, Loki write rate)
  - job_name: "alloy"
    static_configs:
      - targets: ["alloy:12345"]

  # Loki self-monitoring (ingestion rate, query rate, retention)
  - job_name: "loki"
    static_configs:
      - targets: ["loki:3100"]

  # Per-component telemetry disk usage arrives via node-exporter's textfile
  # collector: the disk-usage-exporter sidecar writes disk_usage.prom into a
  # shared volume that node-exporter reads. No separate scrape job needed —
  # the metric appears under job="node-exporter" alongside CPU / RAM / disk.
