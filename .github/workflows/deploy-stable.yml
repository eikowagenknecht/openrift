name: Deploy stable to VPS

on:
  push:
    tags: ["v*"]

concurrency:
  group: deploy-stable
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: cd ~/openrift && ./deploy.sh ${{ github.ref_name }}
