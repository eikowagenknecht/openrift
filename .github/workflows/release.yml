name: Release

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.semantic.outputs.new_release_version }}
      released: ${{ steps.semantic.outputs.new_release_published }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Run semantic-release
        id: semantic
        uses: cycjimmy/semantic-release-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: No release needed
        if: steps.semantic.outputs.new_release_published != 'true'
        run: |
          echo "::error::No releasable commits found"
          exit 1

      - name: Summary
        if: steps.semantic.outputs.new_release_published == 'true'
        run: echo "## Released v${{ steps.semantic.outputs.new_release_version }}" >> "$GITHUB_STEP_SUMMARY"

  build:
    runs-on: ubuntu-latest
    needs: release
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push images
        uses: docker/bake-action@v7
        with:
          source: .
          files: ./docker-bake.hcl
          targets: default
          push: true
        env:
          OWNER: ${{ github.repository_owner }}
          REF: v${{ needs.release.outputs.version }}
          PUSH_LATEST: true
          CACHE_SCOPE: main-build
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

  # See the note on the same job in preview.yml: only booting the image proves
  # the SSR bundle links, and that has to happen before the deploy job runs.
  smoke:
    runs-on: ubuntu-latest
    needs: [release, build]
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Boot the web image and probe /health
        run: |
          docker run -d --name web-smoke -p 3001:3001 \
            -e PORT=3001 -e API_WAIT_TIMEOUT=1 \
            ghcr.io/${{ github.repository_owner }}/openrift-web:v${{ needs.release.outputs.version }}
          for _ in $(seq 1 30); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3001/health)" = "200" ]; then
              echo "SSR server answered /health"
              exit 0
            fi
            sleep 2
          done
          echo "::error::web image never answered 200 on /health"
          docker logs web-smoke
          exit 1

  deploy:
    runs-on: ubuntu-latest
    needs: [release, build, smoke]
    concurrency:
      group: deploy-stable
      cancel-in-progress: false
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 10m
          script: cd ~/openrift && ./deploy.sh
