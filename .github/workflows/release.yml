name: Release

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGES: openrift-api openrift-web openrift-proxy openrift-bot

jobs:
  # Runs before semantic-release: a superseded preview build (no sha image)
  # fails here instead of minting a version nothing can ship.
  wait-for-image:
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for the preview build of ${{ github.sha }}
        run: |
          for _ in $(seq 1 45); do
            missing=""
            for img in $IMAGES; do
              docker buildx imagetools inspect "ghcr.io/${{ github.repository_owner }}/$img:sha-${{ github.sha }}" >/dev/null 2>&1 || missing="$missing $img"
            done
            if [ -z "$missing" ]; then
              echo "all images present for sha-${{ github.sha }}"
              exit 0
            fi
            echo "waiting for:$missing"
            sleep 20
          done
          echo "::error::no preview image for ${{ github.sha }} after 15 minutes. Run the Preview workflow on main, then dispatch Release again."
          exit 1

  release:
    runs-on: ubuntu-latest
    needs: wait-for-image
    outputs:
      version: ${{ steps.semantic.outputs.new_release_version }}
      released: ${{ steps.semantic.outputs.new_release_published }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Run semantic-release
        id: semantic
        uses: cycjimmy/semantic-release-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: No release needed
        if: steps.semantic.outputs.new_release_published != 'true'
        run: |
          echo "::error::No releasable commits found"
          exit 1

      - name: Summary
        if: steps.semantic.outputs.new_release_published == 'true'
        run: echo "## Released v${{ steps.semantic.outputs.new_release_version }}" >> "$GITHUB_STEP_SUMMARY"

  promote:
    runs-on: ubuntu-latest
    needs: release
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag sha-${{ github.sha }} as v${{ needs.release.outputs.version }} and latest
        run: |
          for img in $IMAGES; do
            repo="ghcr.io/${{ github.repository_owner }}/$img"
            docker buildx imagetools create \
              -t "$repo:v${{ needs.release.outputs.version }}" \
              -t "$repo:latest" \
              "$repo:sha-${{ github.sha }}"
          done

  # See the note on the same job in preview.yml: only booting the image proves
  # the SSR bundle links, and that has to happen before the deploy job runs.
  smoke:
    runs-on: ubuntu-latest
    needs: [release, promote]
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Boot the web image and probe /health
        run: |
          docker run -d --name web-smoke -p 3001:3001 \
            -e PORT=3001 -e API_WAIT_TIMEOUT=1 \
            ghcr.io/${{ github.repository_owner }}/openrift-web:v${{ needs.release.outputs.version }}
          for _ in $(seq 1 30); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3001/health)" = "200" ]; then
              echo "SSR server answered /health"
              exit 0
            fi
            sleep 2
          done
          echo "::error::web image never answered 200 on /health"
          docker logs web-smoke
          exit 1

  deploy:
    runs-on: ubuntu-latest
    needs: [release, promote, smoke]
    concurrency:
      group: deploy-stable
      cancel-in-progress: false
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 10m
          script: cd ~/openrift && ./deploy.sh
