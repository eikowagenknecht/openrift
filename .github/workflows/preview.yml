name: Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  packages: write

concurrency:
  group: preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push images
        uses: docker/bake-action@v7
        with:
          source: .
          files: ./docker-bake.hcl
          targets: default
          push: true
        env:
          OWNER: ${{ github.repository_owner }}
          REF: preview
          PUSH_LATEST: false
          CACHE_SCOPE: main-build

  # A clean `vite build` and a green typecheck do not prove the SSR bundle
  # links: the web image ships only `.output`, so any dependency the bundler
  # left as a bare require has nothing to resolve against and every request
  # 500s. Booting the image is the only thing that catches it, so do that
  # before the deploy job can put it in front of anyone.
  smoke:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Boot the web image and probe /health
        run: |
          docker run -d --name web-smoke -p 3001:3001 \
            -e PORT=3001 -e API_WAIT_TIMEOUT=1 \
            ghcr.io/${{ github.repository_owner }}/openrift-web:preview
          for _ in $(seq 1 30); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3001/health)" = "200" ]; then
              echo "SSR server answered /health"
              exit 0
            fi
            sleep 2
          done
          echo "::error::web image never answered 200 on /health"
          docker logs web-smoke
          exit 1

  deploy:
    runs-on: ubuntu-latest
    needs: [build, smoke]
    concurrency:
      group: deploy-preview
      cancel-in-progress: false
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 10m
          script: cd ~/openrift-preview && ./deploy.sh
