version: 2
# "npm" + enable-beta-ecosystems is a workaround so Dependabot updates bun.lock.
# "bun" ecosystem is GA but has a known bug where it skips the lockfile:
# https://github.com/dependabot/dependabot-core/issues/11602
enable-beta-ecosystems: true
updates:
  # Check for updates to the used NPM packages every week
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "main"
    commit-message:
      prefix: "chore"
      include: "scope"
    assignees:
      - eikowagenknecht
    groups:
      # Everything that is not a major update
      npm-updates:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Check for updates to GitHub Actions every week
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "main"
    commit-message:
      prefix: "ci"
      include: "scope"
    assignees:
      - eikowagenknecht

  # Check for updates to Docker images every week. One entry per directory
  # that contains a Dockerfile or docker-compose file — Dependabot doesn't
  # recurse, so each location needs its own block.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "main"
    commit-message:
      prefix: "build"
      include: "scope"
    assignees:
      - eikowagenknecht

  # Monitoring stack: tempo, loki, alloy, grafana, prometheus, exporters.
  - package-ecosystem: "docker-compose"
    directory: "/monitoring"
    schedule:
      interval: "weekly"
    target-branch: "main"
    commit-message:
      prefix: "build"
      include: "scope"
    assignees:
      - eikowagenknecht
    groups:
      monitoring-images:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Backup stack
  - package-ecosystem: "docker-compose"
    directory: "/backup"
    schedule:
      interval: "weekly"
    target-branch: "main"
    commit-message:
      prefix: "build"
      include: "scope"
    assignees:
      - eikowagenknecht
