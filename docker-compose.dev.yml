# Usage: docker compose -f docker-compose.dev.yml up
#
# Only Postgres runs in Docker during development.
# Run the Hono API and Vite dev server natively with `pnpm dev`.
#
# Connection string for local dev:
#   DATABASE_URL=postgres://openrift:dev_password@localhost:5432/openrift
services:
  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    volumes:
      - pg_dev_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: openrift
      POSTGRES_USER: openrift
      POSTGRES_PASSWORD: dev_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openrift -d openrift"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pg_dev_data:
