server {
    listen 443 ssl;
    server_name preview.openrift.app;

    ssl_certificate     /home/openrift/openrift-preview/certs/origin.pem;
    ssl_certificate_key /home/openrift/openrift-preview/certs/origin-key.pem;

    # TLS hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # HSTS (TLS-specific, belongs on the terminating proxy)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Preview deploys must never be indexed. Layer 3 of 3 (see also the
    # `robots` meta in __root.tsx and the /robots.txt handler in server.ts).
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Restore the real visitor IP behind Cloudflare (see openrift.conf for
    # details). Note the preview checkout path.
    include /home/openrift/openrift-preview/nginx/cloudflare-realip.conf;
    real_ip_header CF-Connecting-IP;

    client_max_body_size 50m;

    # Static maintenance page served when the upstream proxy container is
    # unreachable (most commonly during a deploy). The HTML lives in the
    # repo at nginx/maintenance.html and is kept current by deploy.sh's
    # git pull on the VPS, so no separate copy step is needed.
    error_page 502 503 504 =503 @maintenance;

    location @maintenance {
        root /home/openrift/openrift-preview/nginx;
        rewrite ^.*$ /maintenance.html break;
        # add_header doesn't inherit into a location once any add_header is
        # set here, so re-declare the server-level HSTS and noindex headers.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
        add_header Retry-After 60 always;
    }

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Fail fast when the proxy container is unreachable so clients see
        # the maintenance page within seconds instead of waiting for the
        # default 60s connect timeout.
        proxy_connect_timeout 2s;
    }
}

server {
    listen 80;
    server_name preview.openrift.app;
    return 301 https://$server_name$request_uri;
}
