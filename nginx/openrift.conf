server {
    listen 443 ssl;
    server_name openrift.app;

    ssl_certificate     /home/openrift/openrift/certs/origin.pem;
    ssl_certificate_key /home/openrift/openrift/certs/origin-key.pem;

    # TLS hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # HSTS (TLS-specific, belongs on the terminating proxy)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Restore the real visitor IP behind Cloudflare: when (and only when) the
    # TCP peer is a published Cloudflare range, $remote_addr is rewritten to
    # the CF-Connecting-IP header Cloudflare sets. Direct-to-origin clients
    # keep their genuine peer address and can't forge the header. This makes
    # the X-Real-IP we forward below (and the rate limits keyed on it) truly
    # per-visitor instead of per-Cloudflare-edge. Regenerate the include with
    # scripts/update-cloudflare-ips.sh when Cloudflare's ranges change and
    # scp it to ~/openrift/nginx/ alongside this config.
    include /home/openrift/openrift/nginx/cloudflare-realip.conf;
    real_ip_header CF-Connecting-IP;

    client_max_body_size 50m;

    # Static maintenance page served when the upstream proxy container is
    # unreachable (most commonly during a deploy, when the proxy container
    # is being recreated). The HTML lives in the repo at nginx/maintenance.html
    # and is scp'd to ~/openrift/nginx/ on the VPS (no git checkout there —
    # see docs/deployment.md).
    error_page 502 503 504 =503 @maintenance;

    location @maintenance {
        root /home/openrift/openrift/nginx;
        rewrite ^.*$ /maintenance.html break;
        # A POST reaching a static file is a 405 from the static module, so
        # without this every timed-out mutation is answered "405 Not Allowed"
        # instead of the 503 the fallback exists to send.
        error_page 405 =503 /maintenance.html;
        # add_header doesn't inherit into a location once any add_header is set
        # here, so re-declare the server-level HSTS header too.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Cache-Control "no-store" always;
        add_header Retry-After 60 always;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        # Overwrites any client-sent X-Real-IP with the actual connection IP.
        # The API's rate limiter keys on this header, so it must not be spoofable.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Fail fast when the proxy container is unreachable so clients see
        # the maintenance page within seconds instead of waiting for the
        # default 60s connect timeout.
        proxy_connect_timeout 2s;
    }
}

# Redirect www to non-www (Cloudflare handles this primarily, nginx as fallback)
server {
    listen 443 ssl;
    server_name www.openrift.app;

    ssl_certificate     /home/openrift/openrift/certs/origin.pem;
    ssl_certificate_key /home/openrift/openrift/certs/origin-key.pem;

    return 301 https://openrift.app$request_uri;
}

server {
    listen 80;
    server_name openrift.app www.openrift.app;
    return 301 https://openrift.app$request_uri;
}
