limit_req_zone $http_x_real_ip zone=api:10m rate=30r/s;

# The stock `main` format plus request timing: rt is the full request time
# (including the client network), urt is how long the upstream (web/api
# container) took — `-` for locations nginx serves directly. Appended as
# key=value so existing log parsing (Loki pattern/regexp queries) keeps
# matching the combined-style prefix unchanged.
log_format timed '$remote_addr - $remote_user [$time_local] "$request" '
                 '$status $body_bytes_sent "$http_referer" '
                 '"$http_user_agent" "$http_x_forwarded_for" '
                 'rt=$request_time urt=$upstream_response_time';

# CSP header value. Streaming SSR injects inline <script> tags for each
# streamed Suspense chunk, so 'unsafe-inline' is required for script-src.
# Nonce-based CSP is impractical with streaming (CSP header is sent before
# chunks are generated). 'unsafe-eval' is required because Zod 4 JIT-compiles
# schemas via `new Function()` for performance.
# Umami analytics (umami.eikowagenknecht.com) needs script-src to load the
# tracker and connect-src to send beacon events.
# Sentry browser envelopes go through our own /api/v1/sentry-tunnel route
# (covered by 'self' in connect-src) — the API forwards them to Sentry from
# the server side, so we don't whitelist *.ingest.sentry.io directly.
map $uri $csp_header {
    default "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://umami.eikowagenknecht.com; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; connect-src 'self' https://umami.eikowagenknecht.com; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';";
}

# The image's bundled mime.types knows `js` but not `mjs`, so a .mjs asset is
# served as the default_type (application/octet-stream). A module script with a
# non-JavaScript type is refused by the browser, and /assets/ sends `nosniff`,
# so there is no recovery from it. This block merges into the mime.types
# nginx.conf includes rather than replacing it.
types {
    application/javascript mjs;
}

# Resolve X-Real-IP at the server level so it's available in all locations.
map $http_x_real_ip $real_ip {
    default $http_x_real_ip;
    ""      $remote_addr;
}

server {
    listen 8080;
    server_name _;

    # /dev/stdout keeps the log flowing into Docker (and from there into
    # Loki via Alloy), same as the image default — only the format changes.
    access_log /dev/stdout timed;

    client_max_body_size 50m;

    # ── Security headers (server-level defaults) ─────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(self)" always;
    add_header Content-Security-Policy $csp_header always;

    # ── Nginx status for monitoring (internal access only) ─────────────────
    location /nginx_status {
        stub_status;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 10.0.0.0/8;
        allow 127.0.0.1;
        deny all;
    }

    # ── API: proxy to Hono (unchanged) ───────────────────────────────────
    # `^~` so the image-extension regex block below can't steal API routes
    # whose URL ends in a cacheable extension (e.g. the server-rendered share
    # images at /api/v1/lists/:id/image.png, /api/v1/lists/share/:token/image.png,
    # /api/v1/users/share/:token/image.png). Without it, nginx matches `/api/`
    # as a prefix but a matching regex location wins, serving a static 404 from
    # /srv/static instead of proxying to the api container. Same reasoning as
    # the `^~` on /assets/ and /media/ below.
    location ^~ /api/ {
        limit_req zone=api burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $real_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # ── Static: hashed assets (immutable, long cache) ────────────────────
    # `^~` skips regex matching once this prefix matches, so the unhashed
    # static block below can't steal `.woff2`/`.svg` files out of /assets/
    # and downgrade them from 1-year-immutable to 30 days.
    location ^~ /assets/ {
        root /srv/static;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # ── Static: media files (card images, set images — immutable, long cache)
    # `^~` for the same reason as /assets/ above.
    location ^~ /media/ {
        root /srv/static;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # ── Static: unhashed public files (favicons, logos, /images/ icons) ──
    # 30-day cache without `immutable` since these paths aren't content-
    # hashed; stale-while-revalidate softens replace-in-place updates.
    location ~* \.(webp|svg|png|jpg|jpeg|ico|gif)$ {
        root /srv/static;
        expires 30d;
        add_header Cache-Control "public, stale-while-revalidate=604800" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # ── Everything else: proxy to TanStack Start SSR server ──────────────
    location / {
        proxy_pass http://web:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $real_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
        proxy_connect_timeout 2s;

        # Cache-Control is set by the SSR app itself (see
        # apps/web/src/lib/page-cache.ts) so the app is the single source of
        # truth for per-route cacheability. Adding a header here would stack
        # with the app's value and defeat Cloudflare edge caching.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy $csp_header always;

        # Second-layer maintenance fallback: handles the case where this
        # proxy container is up but the SSR `web` container is unreachable
        # (rare — partial-deploy or web-only crash). The host nginx catches
        # the more common case where this proxy itself is down.
        error_page 502 503 504 =503 @maintenance;
    }

    # Internal location for the maintenance fallback. `internal` keeps it
    # unreachable from the outside (it's only invoked via error_page).
    location @maintenance {
        root /srv/static;
        rewrite ^.*$ /maintenance.html break;
        # A POST reaching a static file is a 405 from the static module, so
        # without this every timed-out mutation is answered "405 Not Allowed"
        # instead of the 503 the fallback exists to send.
        error_page 405 =503 /maintenance.html;
        add_header Cache-Control "no-store" always;
        add_header Retry-After 60 always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy $csp_header always;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;
}
